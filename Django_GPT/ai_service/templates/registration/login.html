{% extends 'ai_service/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🔐 로그인</h4>
            </div>
            <div class="card-body">
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            아이디나 비밀번호가 올바르지 않습니다.
                        </div>
                    {% endif %}

                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label for="id_username" class="form-label">아이디</label>
                        {{ form.username }}
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">비밀번호</label>
                        {{ form.password }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">로그인 하기</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <p>아직 계정이 없으신가요? <a href="{% url 'ai_service:signup' %}">회원가입 하기</a></p>
        </div>
    </div>
</div>

<style>
    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ced4da;
        border-radius: 4px;
    }
</style>
{% endblock %}
