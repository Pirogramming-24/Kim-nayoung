{% extends 'ai_service/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">📝 회원가입</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                        <div class="form-text text-muted small">{{ field.help_text }}</div>
                        {% endif %}
                        {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">가입 완료</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <p>이미 계정이 있으신가요? <a href="{% url 'login' %}">로그인 하러가기</a></p>
        </div>
    </div>
</div>

<style>
    input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ced4da;
        border-radius: 4px;
    }
    ul { list-style: none; padding: 0; } /* 폼 도움말 리스트 스타일 제거 */
</style>
{% endblock %}
