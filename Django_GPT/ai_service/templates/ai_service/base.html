<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django AI Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .result-box { background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd; margin-top: 20px; min-height: 100px; }
        .nav-link.active { font-weight: bold; background-color: #e9ecef !important; }
    </style>
</head>
<body>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="{% url 'ai_service:index' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <span class="fs-4">🤖 My AI Service</span>
            </a>

            <ul class="nav nav-pills">
                {% if user.is_authenticated %}
                    <li class="nav-item"><span class="nav-link text-muted">{{ user.username }}님</span></li>
                    <li class="nav-item"><form action="{% url 'logout' %}" method="post"><{% csrf_token %}<button type="submit" class="btn btn-outline-danger">Logout</button></form></li>
                {% else %}
                    <li class="nav-item me-2"><a href="{% url 'login' %}" class="btn btn-outline-primary">Login</a></li>
                    <li class="nav-item"><a href="{% url 'ai_service:signup' %}" class="btn btn-primary">Sign Up</a></li>
                {% endif %}
            </ul>
        </header>

        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'translate' %}active{% endif %}" href="{% url 'ai_service:translate' %}">🌏 번역 (Translate)</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'summarize' %}active{% endif %}" href="{% url 'ai_service:summarize' %}">📝 요약 (Summarize)</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'generate' %}active{% endif %}" href="{% url 'ai_service:generate' %}">✨ 생성 (Generate)</a>
            </li>
        </ul>

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div id="loading-overlay" class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="background: rgba(255, 255, 255, 0.8); z-index: 9999;">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h4 class="mt-3 text-dark">AI가 열심히 작업 중입니다... 🤖</h4>
            <p class="text-muted">잠시만 기다려주세요!</p>
        </div>
    </div>

    <script>
        // 폼이 제출(Submit)될 때 로딩 화면을 보여주는 스크립트
        document.addEventListener("DOMContentLoaded", function() {
            const forms = document.querySelectorAll("form");
            const loader = document.getElementById("loading-overlay");

            forms.forEach(form => {
                form.addEventListener("submit", function() {
                    // 로딩 화면 보이기 (Bootstrap 클래스 활용)
                    loader.classList.remove("d-none");
                });
            });
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
