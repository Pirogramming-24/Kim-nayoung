<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - Pirostagram</title>
    <style>
        body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        .box { background: white; border: 1px solid #dbdbdb; padding: 40px; width: 350px; text-align: center; margin-bottom: 10px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #dbdbdb; border-radius: 3px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0095f6; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Pirostagram</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.username }}
            {{ form.password }}
            <button type="submit">로그인</button>
        </form>
    </div>
    <div class="box">
        계정이 없으신가요? <a href="{% url 'users:signup' %}" style="color: #0095f6; text-decoration: none;">가입하기</a>
    </div>
</body>
</html>
