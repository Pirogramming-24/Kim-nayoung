<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pirostagram</title>
    <style>
        body { background-color: #fafafa; display: flex; justify-content: center; }
        .container { width: 400px; margin-top: 30px; }
        .card { background: white; border: 1px solid #dbdbdb; margin-bottom: 20px; border-radius: 3px; }
        .card-header { padding: 10px; font-weight: bold; border-bottom: 1px solid #efefef; }
        .card-img img { width: 100%; display: block; }
        .card-body { padding: 10px; }
        .like-btn { cursor: pointer; border: none; background: none; font-size: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pirostagram</h1>
        
        {% for post in posts %}
            <div class="card">
                <div class="card-header">
                    {{ post.author.username }}
                </div>
                
                <div class="card-img">
                    {% if post.image %}
                        <img src="{{ post.image.url }}" alt="Post Image">
                    {% endif %}
                </div>
                
                <div class="card-body">
                    <button class="like-btn" onclick="likePost({{ post.id }})">
                        {% if user in post.like_users.all %}
                            ♥ {% else %}
                            ♡ {% endif %}
                    </button>
                    <span id="like-count-{{ post.id }}">{{ post.like_users.count }}</span>명
                    <p><strong>{{ post.author.username }}</strong> {{ post.content }}</p>
                    <p style="color: gray; font-size: 12px;">{{ post.created_at|date:"Y-m-d" }}</p>
                </div>
            </div>
        {% empty %}
            <p>게시글이 없습니다.</p>
        {% endfor %}
        </div>

        <script>
            // Ajax 요청을 보내는 함수
            const likePost = (postId) => {
                // 1. 요청 보낼 url 설정
                const url = '/like/';

                // 2. fetch로 서버에 데이터 전송
                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ post_id: postId }) // 게시글 번호를 JSON으로 보냄
                })
                .then(response => response.json()) // 3. 서버 응답을 JSON으로 파싱
                .then(data => {
                    // 4. 화면 업데이트 (새로고침 없이!)
                    const likeBtn = document.querySelector(`.like-btn[onclick="likePost(${postId})"]`);
                    const likeCount = document.getElementById(`like-count-${postId}`);
                    
                    // 하트 모양 변경
                    if (data.liked) {
                        likeBtn.innerText = '♥';
                    } else {
                        likeBtn.innerText = '♡';
                    }
                    // 숫자 변경
                    likeCount.innerText = data.like_count;
                })
                .catch(error => console.error('Error:', error));
            }
        </script>
</body>
</html>
